name: Aruma Daily Sync

on:
  schedule:
    # Corre todos los días a las 14:00 UTC (9:00 AM Bogotá)
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        timeout-minutes: 15
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Chromium de Playwright: se baja de la CDN de Playwright (no depende de los espejos de Ubuntu).
          for i in 1 2 3; do
            playwright install chromium && break
            echo "playwright install falló (intento $i/3), reintento en 30s..."; sleep 30
          done
          playwright install chromium
          # Por apt solo faltan fuentes extra (chino, japonés, tailandés, cirílico): las librerías de Chrome ya
          # vienen en el runner. El 11-nov-2026 GitHub no resolvía archive/security.ubuntu.com y
          # 'install --with-deps' dejó colgadas las tres corridas de las 9 a. m. 30-40 min; ahora se intenta
          # máximo 4 min y se sigue sin ellas. (El repo apt de google-chrome a veces da "Hash Sum mismatch":
          # se quita antes.)
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google*.list
          timeout 240 playwright install-deps chromium || echo "::warning::No se instalaron las fuentes extra por apt (espejos de Ubuntu sin respuesta); se sigue sin ellas"
      
      - name: Run scraper
        env:
          ARUMA_USER: ${{ secrets.ARUMA_USER }}
          ARUMA_PASSWORD: ${{ secrets.ARUMA_PASSWORD }}
          ARUMA_APPS_SCRIPT_URL: ${{ secrets.ARUMA_APPS_SCRIPT_URL }}
        run: python aruma_sync.py
