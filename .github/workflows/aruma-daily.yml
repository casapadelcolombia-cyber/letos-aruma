name: Aruma Daily Sync

on:
  schedule:
    # Corre todos los días a las 14:00 UTC (9:00 AM Bogotá)
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # El runner trae el repo apt de google-chrome, que a veces da "Hash Sum mismatch"
          # y tumba 'playwright install --with-deps'. No lo usamos: lo quitamos y reintentamos.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google*.list
          for i in 1 2 3; do
            playwright install --with-deps chromium && break
            echo "playwright install falló (intento $i/3), reintento en 30s..."; sleep 30
          done
          playwright install --with-deps chromium
      
      - name: Run scraper
        env:
          ARUMA_USER: ${{ secrets.ARUMA_USER }}
          ARUMA_PASSWORD: ${{ secrets.ARUMA_PASSWORD }}
          ARUMA_APPS_SCRIPT_URL: ${{ secrets.ARUMA_APPS_SCRIPT_URL }}
        run: python aruma_sync.py
